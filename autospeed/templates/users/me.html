{% extends "base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}
    <h1>{{ user.username }}</h1>

    {% if user.entries %}
        <h2>Recent entries</h2>
        <ul>
            {% for entry in entries %}
                <li>{{ entry.title }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No entries yet.</p>
    {% endif %}
{% endblock %}
