{% extends "base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}
    <h1>My Profile</h1>

    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Role:</strong> {{ user.role }}</p>
    <p><strong>Joined:</strong> {{ user.created_at.strftime('%Y-%m-%d') }}</p>
    <p><strong>Entries:</strong> {{ user.entries|length }}</p>

    <a href="{{ url_for('users.edit_me') }}">Edit profile</a>

    <form method="post" action="{{ url_for('users.delete_me') }}" style="display: inline;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" onclick="return confirm('This will permanently delete your account and all your entries. Are you sure?')">Delete my account</button>
    </form>
{% endblock %}
