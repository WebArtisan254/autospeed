{% extends "base.html" %}

{% block title %}New Entry{% endblock %}

{% block content %}
    <a href="{{ url_for('entries.index') }}" class="btn btn-outline-primary mb-3">← Back to Entries</a>

    <h1>New Entry</h1>

    {% if errors.get("__all__") %}
        <div class="alert alert-danger">{{ errors["__all__"] }}</div>
    {% endif %}

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% include "entries/_form.html" %}
        <button type="submit" class="btn btn-primary">Create</button>
    </form>
{% endblock %}
