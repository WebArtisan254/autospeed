{% extends "base.html" %}

{% block title %}{{ entry.title }}{% endblock %}

{% block content %}
    <a href="{{ url_for('entries.index') }}" class="btn btn-outline-primary mb-3">← Back to Entries</a>

    <div class="card mb-4">
        <div class="card-body">
            <h1>{{ entry.title }}</h1>
            <p><small>{{ entry.status }} — {{ entry.created_at.strftime('%Y-%m-%d %H:%M') }}</small></p>
            <div>{{ entry.content }}</div>
        </div>
    </div>

    <a href="{{ url_for('entries.edit', entry_id=entry.id) }}" class="btn btn-primary me-2">UpDate</a>

    <form method="post" action="{{ url_for('entries.delete', entry_id=entry.id) }}" style="display: inline;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-danger" onclick="return confirm('Delete this entry?')">Delete</button>
    </form>
{% endblock %}
