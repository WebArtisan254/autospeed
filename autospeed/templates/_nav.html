<nav>
    <a href="{{ url_for('home.index') }}"><strong>AutoSpeed</strong></a>

    {% if current_user.is_authenticated %}
        <a href="{{ url_for('entries.index') }}">Entries</a>
        <a href="{{ url_for('users.me') }}">Profile</a>
        {% if current_user.is_admin() %}
            <a href="{{ url_for('admin.users') }}">Admin</a>
        {% endif %}
        <form method="post" action="{{ url_for('auth.logout') }}" style="display: inline;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit">Log Out</button>
        </form>
    {% else %}
        <a href="{{ url_for('auth.login') }}">Log In</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
    {% endif %}
</nav>
