{% extends "base.html" %}

{% block title %}Token Created{% endblock %}

{% block content %}
    <h1>Token Created</h1>

    <div class="alert alert-warning">
        <strong>Copy this token now — you won't be able to see it again.</strong>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <code class="fs-5">{{ token }}</code>
        </div>
    </div>

    <a href="{{ url_for('auth.tokens') }}" class="btn btn-primary">Back to Tokens</a>
{% endblock %}
