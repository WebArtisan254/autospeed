services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: autospeed
      POSTGRES_PASSWORD: autospeed_dev
      POSTGRES_DB: autospeed
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autospeed"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      AUTOSPEED_ENV: production
      AUTOSPEED_SECRET_KEY: change-me-to-a-real-secret-in-production
      AUTOSPEED_DATABASE_URL: postgresql://autospeed:autospeed_dev@db:5432/autospeed
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailcatcher
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_SENDER: dev@autospeed.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python worker.py
    environment:
      AUTOSPEED_ENV: production
      AUTOSPEED_SECRET_KEY: change-me-to-a-real-secret-in-production
      AUTOSPEED_DATABASE_URL: postgresql://autospeed:autospeed_dev@db:5432/autospeed
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailcatcher
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_SENDER: dev@autospeed.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

volumes:
  pgdata:
